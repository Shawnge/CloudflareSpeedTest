services:
  cfst:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建期代理：docker pull 走守护进程的代理，而 Dockerfile 里的 go build
      # 跑在构建容器内，不会继承它 —— 所以必须在这里单独透传。
      # 【重要】容器的 127.0.0.1 指容器自己，这里要填容器能访问到宿主代理的地址，
      # 例如 http://172.17.0.1:7890（docker0 网关）或宿主机内网 IP，别填 127.0.0.1。
      # 不设置则不传代理（保持原行为）。在 Portainer 里请配到 Stack 的环境变量中。
      args:
        BUILD_HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        BUILD_HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        BUILD_NO_PROXY: ${BUILD_NO_PROXY:-}
        # 依赖源：默认国内镜像优先、失败回退直连；填 direct 可强制走 GitHub（需上面的代理生效）
        GOPROXY: ${BUILD_GOPROXY:-https://goproxy.cn,direct}
    image: cfst:latest
    container_name: cfst

    # 结果文件写到容器内 /data。这里刻意用**命名卷**而不是相对路径绑定挂载：
    # Portainer 用 Git / Agent 部署 stack 时，compose 里的相对路径 ./output 会被解析成
    # 宿主机的 /data/compose/<id>/output —— 那是 Portainer 自己的数据目录，Docker 守护进程
    # 在宿主机上找不到它（仓库里有没有该目录都没用），于是部署直接失败：
    #   Bind mount failed: '/data/compose/<id>/output' does not exist
    # 命名卷由 Docker 自动创建，不依赖任何宿主路径，Portainer 与命令行都可用。
    # 【本机想直接看到产物】把下面那行换成绑定挂载即可（需要 ./output 存在）：
    #   - ./output:/data
    volumes:
      - cfst-output:/data

    environment:
      # 【必须】GitHub 令牌：fine-grained PAT，只授权目标仓库，权限 Contents: Read and write。
      # 放在与本文件同目录的 .env 里（.env 已被 .gitignore 与 .dockerignore 排除）。
      # 留空只测速不发布；此时若 CRON_SCHEDULE 非空，entrypoint 会报配置错误并退出。
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # 发布目标
      GITHUB_REPO: ${GITHUB_REPO:-Shawnge/CloudflareSpeedTest}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-master}
      RESULT_PATH: ${RESULT_PATH:-result/result.txt}

      # HTTPing 先按地区筛选，每区独立凑满 TOP_N 个合格 IP；候选不足则保留实际数量
      REGIONS: ${REGIONS:-HKG,NRT,SIN,SJC,LAX}
      TOP_N: ${TOP_N:-8}

      # 定时：5 段 cron 表达式。注意这里用的是 “-” 而不是 “:-”，
      # 因此把 .env 里的 CRON_SCHEDULE 留成空值即可让容器只跑一次后退出。
      CRON_SCHEDULE: ${CRON_SCHEDULE-0 4 * * *}
      RUN_ON_START: ${RUN_ON_START:-1}

      # 时区，决定 cron 在本地几点触发
      TZ: ${TZ:-Asia/Shanghai}

      # cfst 的下载测速地址（等价于给 cfst 传 -url）。留空则用内置的 https://cf.xiu2.xyz/url。
      #
      # 【这个地址怎么选】cfst 会拿 ip.txt 里的 IP 直接拨号，SNI/Host 用该地址的域名，
      # 所以该域名必须由 Cloudflare 边缘提供服务 —— 也就是「一个正常挂在 CF 上的域名」
      # （任意网页/文件地址都行，要求：可直接下载、大于 200MB）。
      # 注意 **不要** 用 speed.cloudflare.com：实测它不由任意 CF 边缘提供，拿 ip.txt 里的
      # IP 连它会 TLS 握手失败（cfst 报 `下载测速失败 ... EOF`），地区码永远填不上。
      #
      # 内置地址不保证可用（cfst README 原话「默认地址不保证可用性，建议自建」）。
      # 症状：地区码全是 N/A、下载速度全是 0.00、最终结果为空。
      # 排查：用 CFST_ARGS=-debug（或 docker compose run --rm -e CRON_SCHEDULE= cfst -debug）
      # 看真实报错；换成一个你自建在 CF 上的大文件地址。
      CFST_URL: ${CFST_URL:-}

      # 仅用于验证/调试：1 = 只转换并打印将要提交的 JSON，不发出任何请求，
      # 因此不会写远端。确认无误后设回 0（或删除本行）。
      PUBLISH_DRY_RUN: ${PUBLISH_DRY_RUN:-0}

      # 传给 cfst 的测速参数（等价于 -tl/-dn/-sl）。留空 = 不传该参数。
      #   CFST_TL  平均延迟上限(ms)   CFST_DN  下载测速数量   CFST_SL  下载速度下限(MB/s)
      # 默认地区配额模式使用 TOP_N，CFST_DN 不再限制所有地区的合计数量。
      #
      # CFST_SL 默认 20，即**默认带一个下载速度门槛**；如果线路达不到，cfst 会输出 0 条结果、
      # 连 result.csv 都不创建，于是每天静默不发布（日志里只有一句「结果为空」）。
      # 本方案按延迟筛选、不需要速度门槛，想关掉就把 .env 里设成空值：CFST_SL=
      CFST_TL: ${CFST_TL-200}
      CFST_DN: ${CFST_DN-20}
      CFST_SL: ${CFST_SL-20}

      # cfst 其它参数的兜底入口：这里写的内容会拼到 cfst 命令行前面。
      # 单个参数优先用上面三个变量；要传别的参数（如 -p 线程数、-t 次数）再用这个。
      # 注意：与上面三个变量重复时以上面三个为准（entrypoint 会告警）。
      # 例：CFST_ARGS: ${CFST_ARGS:--p 4}
      CFST_ARGS: ${CFST_ARGS:-}

    # 这里**故意不写 command**：测速参数一律走上面的环境变量，
    # 避免「.env 里改了 CFST_TL 却被 command 里的 -tl 无声压掉」。
    # 想临时试参数（跑一轮，命令行的参数优先）：
    #   docker compose run --rm -e CRON_SCHEDULE= -e TOP_N=5 cfst -tl 500

    # 定时模式下容器要常驻，异常退出自动拉起
    restart: unless-stopped

# 结果卷。实际名称会被 compose 加上项目名前缀（Portainer 里就是「栈名_cfst-output」）。
# 查看内容：Portainer → Volumes → 选中它 → Browse；
# 或命令行：docker run --rm -v <前缀>_cfst-output:/d alpine ls -l /d
volumes:
  cfst-output:
