services:
  cfst:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfst:latest
    container_name: cfst

    # 结果文件写到容器内 /data，落到宿主 ./output（已在 .gitignore 里，不污染仓库工作区）
    volumes:
      - ./output:/data

    environment:
      # 【必须】GitHub 令牌：fine-grained PAT，只授权目标仓库，权限 Contents: Read and write。
      # 放在与本文件同目录的 .env 里（.env 已被 .gitignore 与 .dockerignore 排除）。
      # 留空只测速不发布；此时若 CRON_SCHEDULE 非空，entrypoint 会报配置错误并退出。
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # 发布目标
      GITHUB_REPO: ${GITHUB_REPO:-Shawnge/CloudflareSpeedTest}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-master}
      RESULT_PATH: ${RESULT_PATH:-result/result.txt}

      # 筛选规则：保留的地区码（顺序即输出顺序）、每区保留延迟最低的条数
      REGIONS: ${REGIONS:-HKG,NRT,SIN,SJC,LAX}
      TOP_N: ${TOP_N:-8}

      # 定时：5 段 cron 表达式。注意这里用的是 “-” 而不是 “:-”，
      # 因此把 .env 里的 CRON_SCHEDULE 留成空值即可让容器只跑一次后退出。
      CRON_SCHEDULE: ${CRON_SCHEDULE-0 4 * * *}
      RUN_ON_START: ${RUN_ON_START:-1}

      # 时区，决定 cron 在本地几点触发
      TZ: ${TZ:-Asia/Shanghai}

      # cfst 的下载测速地址（等价于给 cfst 传 -url）。留空则用内置的 https://cf.xiu2.xyz/url。
      #
      # 【这个地址怎么选】cfst 会拿 ip.txt 里的 IP 直接拨号，SNI/Host 用该地址的域名，
      # 所以该域名必须由 Cloudflare 边缘提供服务 —— 也就是「一个正常挂在 CF 上的域名」
      # （任意网页/文件地址都行，要求：可直接下载、大于 200MB）。
      # 注意 **不要** 用 speed.cloudflare.com：实测它不由任意 CF 边缘提供，拿 ip.txt 里的
      # IP 连它会 TLS 握手失败（cfst 报 `下载测速失败 ... EOF`），地区码永远填不上。
      #
      # 内置地址不保证可用（cfst README 原话「默认地址不保证可用性，建议自建」）。
      # 症状：地区码全是 N/A、下载速度全是 0.00、最终结果为空。
      # 排查：给 command 加上 "-debug" 看真实报错；换成一个你自建在 CF 上的大文件地址。
      CFST_URL: ${CFST_URL:-}

      # 仅用于验证/调试：1 = 只转换并打印将要提交的 JSON，不发出任何请求，
      # 因此不会写远端。确认无误后设回 0（或删除本行）。
      PUBLISH_DRY_RUN: ${PUBLISH_DRY_RUN:-0}

    # 传给 cfst 的测速参数。常用（措辞照 cfst README）：
    #   -tl 200   平均延迟上限(ms)      -dn 20    下载测速数量
    #   -dd       禁用下载测速（注意：会让地区码全变成 N/A，本方案不能这么用）
    #
    # 这里**故意不设 -sl**（下载速度下限）。本方案的筛选规则是「每个地区取延迟最低的 N 个」，
    # 并不需要速度门槛；而 -sl 一旦高于实际带宽，cfst 会输出 0 条结果、连 result.csv 都不创建，
    # 于是每天静默不发布、远端永远停在旧内容（只在日志里留一句「结果为空，跳过发布」）。
    # 确实想按速度过滤时再加，例如 "-sl","5"。
    command: ["-tl", "200", "-dn", "20"]

    # 定时模式下容器要常驻，异常退出自动拉起
    restart: unless-stopped
